server:
  port: 8081

spring:
  application:
    name: identity-access-service

  datasource:
    url: jdbc:mysql://localhost:3306/parking_db?createDatabaseIfNotExist=true
    username: root
    password: vihan@46
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema; Hibernate only validates
    properties:
      hibernate:
        default_schema: identity_schema
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: identity_schema
    default-schema: identity_schema
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    lk.ijse.identity: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.netflix.eureka: INFO